name: whalemesh

x-environment: &environment
  MESH_LISTEN: :8080
  MESH_NAMESPACE: default
  MESH_HOST_ID: ${MESH_HOST_ID:-local}
  MESH_ALLOW_PLAINTEXT_SENSITIVE: "1"
  MESH_DATA: /data
  MESH_IDENTITY_FILE: /identity/identity.json
  MESH_TRUST_FILE: /identity/trust.json
  MESH_SEEDS: http://agent:8080,http://llm:8080,http://store:8080

x-node: &node
  image: whalemesh/node:local
  build:
    context: .
    target: node
  init: true
  restart: unless-stopped
  networks: [mesh]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    bootstrap: {condition: service_completed_successfully}

services:
  # Deployment-only key provisioning. Never participates in membership.
  bootstrap:
    image: whalemesh/bootstrap:local
    build: {context: ., target: bootstrap}
    network_mode: none
    volumes:
      - ./deployment/identities.json:/config/identities.json:ro
      - agent_identity:/identities/agent
      - llm_identity:/identities/llm
      - llm_second_identity:/identities/llm-second
      - store_identity:/identities/store
      - knowledge_identity:/identities/knowledge
      - web_identity:/identities/web
      - telegram_identity:/identities/telegram
      - executor_identity:/identities/executor
      - relay_identity:/identities/relay
      - remote_model_identity:/identities/remote-model
      - chat_identity:/identities/chat
      - hello_identity:/identities/hello-0
      - task_zero_identity:/identities/task-0
      - task_one_identity:/identities/task-1

  agent:
    <<: *node
    environment:
      <<: *environment
      MESH_NAME: agent
      MESH_ADVERTISE: http://agent:8080
      NODE_PACKAGES: agent
    volumes: [agent_identity:/identity:ro, agent_data:/data]

  llm:
    <<: *node
    environment:
      <<: *environment
      MESH_NAME: llm
      MESH_ADVERTISE: http://llm:8080
      NODE_PACKAGES: llm
      LLM_MOCK: ${LLM_MOCK:-1}
    extra_hosts: [host.docker.internal:host-gateway]
    volumes: [llm_identity:/identity:ro, llm_data:/data]

  store:
    <<: *node
    environment:
      <<: *environment
      MESH_NAME: store
      MESH_ADVERTISE: http://store:8080
      NODE_PACKAGES: providers
      PROVIDER_CAPABILITIES: session.store,workspace.files,events.write,stats.ingest
    volumes: [store_identity:/identity:ro, store_data:/data]

  knowledge:
    <<: *node
    environment:
      <<: *environment
      MESH_NAME: knowledge
      MESH_ADVERTISE: http://knowledge:8080
      NODE_PACKAGES: providers
      PROVIDER_CAPABILITIES: memory.store,memory.search,secrets.resolve,skills.search
    volumes: [knowledge_identity:/identity:ro, knowledge_data:/data]

  web:
    <<: *node
    environment:
      <<: *environment
      MESH_NAME: web
      MESH_ADVERTISE: http://web:8080
      NODE_PACKAGES: web
      WEB_ADMIN_USER: ${WEB_ADMIN_USER:-admin}
      WEB_ADMIN_PASSWORD_FILE: /identity/admin-password
      WEB_STATIC_DIR: /app/web
    ports: ["127.0.0.1:${WEBUI_PORT:-18000}:8080"]
    volumes: [web_identity:/identity:ro, web_data:/data]

  telegram:
    <<: *node
    profiles: [telegram]
    environment:
      <<: *environment
      MESH_NAME: telegram
      MESH_ADVERTISE: http://telegram:8080
      NODE_PACKAGES: telegram
    volumes: [telegram_identity:/identity:ro, telegram_data:/data]

  executor:
    <<: *node
    profiles: [executor]
    group_add: ["${DOCKER_GID:-0}"]
    environment:
      <<: *environment
      MESH_NAME: executor
      MESH_ADVERTISE: http://executor:8080
      NODE_PACKAGES: executor
      EXECUTOR_NETWORK: whalemesh_net
      EXECUTOR_ALLOWED_IMAGES: whalemesh/hello:local,whalemesh/node:local
      EXECUTOR_NODE_IMAGE: whalemesh/node:local
      EXECUTOR_IDENTITIES_DIR: /pool
      EXECUTOR_APPROVAL_KEYS_FILE: /identity/approval-keys.json
    volumes:
      - executor_identity:/identity:ro
      - executor_data:/data
      - hello_identity:/pool/hello-0:ro
      - task_zero_identity:/pool/task-0:ro
      - task_one_identity:/pool/task-1:ro
      - /var/run/docker.sock:/var/run/docker.sock

  relay:
    <<: *node
    profiles: [relay]
    environment:
      <<: *environment
      MESH_NAME: relay
      MESH_ADVERTISE: ${RELAY_ADVERTISE:-http://relay:8080}
      NODE_PACKAGES: relay
    ports: ["127.0.0.1:${RELAY_PORT:-18088}:8080"]
    volumes: [relay_identity:/identity:ro, relay_data:/data]

  llm-second:
    <<: *node
    profiles: [multi-provider]
    environment:
      <<: *environment
      MESH_NAME: llm-second
      MESH_ADVERTISE: http://llm-second:8080
      NODE_PACKAGES: llm
      LLM_MOCK: ${LLM_MOCK:-1}
    volumes: [llm_second_identity:/identity:ro, llm_second_data:/data]

  hello:
    <<: *node
    profiles: [example]
    image: whalemesh/hello:local
    build: {context: ., target: hello}
    environment:
      <<: *environment
      MESH_NAME: hello
      MESH_ADVERTISE: http://hello:8080
    volumes: [hello_identity:/identity:ro, hello_data:/data]

  chat:
    <<: *node
    profiles: [cli]
    restart: "no"
    entrypoint: [/app/chat]
    command: [Hello WhaleMesh]
    environment:
      <<: *environment
      MESH_NAME: chat
      MESH_ADVERTISE: http://chat:8080
    volumes: [chat_identity:/identity:ro, chat_data:/data]

networks:
  mesh: {name: whalemesh_net}

volumes:
  agent_identity:
  llm_identity:
  llm_second_identity:
  store_identity:
  knowledge_identity:
  web_identity:
  telegram_identity:
  executor_identity:
  relay_identity:
  remote_model_identity:
  chat_identity:
  hello_identity:
  task_zero_identity:
  task_one_identity:
  agent_data:
  llm_data:
  llm_second_data:
  store_data:
  knowledge_data:
  web_data:
  telegram_data:
  executor_data:
  relay_data:
  hello_data:
  chat_data:
